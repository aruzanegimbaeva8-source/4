<title>Физика 7 · 4-тоқсан</title>
<style>
:root{--bg:#f4f7fb;--sf:#fff;--tx:#1b2433;--mu:#5b667a;--bd:#d8e0ec;--ac:#3b6cf6;--A:#1faa6b;--B:#2f80ed;--C:#8e44ec;--S:#f2994a;--ok:#1faa6b;--no:#e5484d;--fs:16px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--sf:#1a2336;--tx:#e8edf7;--mu:#9aa6bd;--bd:#2c3853;--ac:#7c9cff}}
:root[data-theme="dark"]{--bg:#0f1624;--sf:#1a2336;--tx:#e8edf7;--mu:#9aa6bd;--bd:#2c3853;--ac:#7c9cff}
:root[data-hc="1"]{--bg:#000;--sf:#000;--tx:#ffff00;--mu:#fff;--bd:#ffff00;--ac:#00ffff;--A:#00ff66;--B:#00ccff;--C:#ff80ff;--S:#ffa500;--ok:#00ff66;--no:#ff5c5c}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:var(--fs)/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--sf);border-bottom:2px solid var(--bd)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:30}
h1{font-size:1.1em;margin:0;flex:1;min-width:140px}
button{font:inherit;color:var(--tx);background:var(--sf);border:2px solid var(--bd);border-radius:10px;padding:6px 10px;cursor:pointer;transition:transform .15s,border-color .15s}
button:hover{transform:translateY(-2px);border-color:var(--ac)}button:focus-visible{outline:3px solid var(--ac)}
.lang button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
:root[data-hc="1"] .lang button.on{color:#000}
.wrap{display:flex;min-height:calc(100% - 60px)}
aside{width:290px;max-height:calc(100vh - 60px);position:sticky;top:60px;flex:none;padding:14px;border-right:2px solid var(--bd);background:var(--sf);overflow:auto}
main{flex:1;padding:16px;max-width:900px;margin:0 auto;min-width:0}
.tp{display:block;width:100%;text-align:left;margin-bottom:8px;padding:10px}
.tp.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--sf))}
.tp small{display:block;color:var(--mu)}
#menu{display:none}
.bar{height:12px;border-radius:8px;background:var(--bd);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--A),var(--B),var(--C));transition:width .6s}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{width:30px;height:30px;padding:0;border-radius:50%;font-size:.7em;font-weight:700}
.st-done{background:var(--ok)!important;color:#fff;border-color:var(--ok)}.st-prog{background:#f5c542!important;color:#000}
.goal{background:color-mix(in srgb,var(--ac) 10%,var(--sf));border-left:5px solid var(--ac);padding:10px 12px;border-radius:8px;margin-bottom:12px}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button.on{background:var(--S);color:#000;border-color:var(--S)}
.card{background:var(--sf);border:2px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:16px;animation:pop .5s both}
.card:nth-child(2){animation-delay:.1s}.card:nth-child(3){animation-delay:.2s}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
.mq{font-size:.85em;color:var(--mu);margin:4px 0}.xr{display:flex;gap:6px;align-items:center;margin:6px 0}.xr span{flex:1}select{font:inherit;padding:6px;border-radius:8px;border:2px solid var(--bd);background:var(--sf);color:var(--tx);max-width:55%}.badge{display:inline-block;color:#fff;border-radius:20px;padding:2px 12px;font-weight:700;font-size:.85em}
:root[data-hc="1"] .badge{color:#000}
.em{font-size:2.6em;display:inline-block;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
.q{font-size:1.1em;margin:8px 0}
.sen .q{font-size:1.35em}.sen .opt{font-size:1.2em;padding:16px}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px}
.opt.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 16%,var(--sf))}
.opt.good{background:var(--ok);color:#fff;border-color:var(--ok);animation:pulse .5s}
.opt.bad{background:var(--no);color:#fff;border-color:var(--no);animation:shake .4s}
:root[data-hc="1"] .opt.good,:root[data-hc="1"] .opt.bad{color:#000}
@keyframes pulse{50%{transform:scale(1.04)}}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.ex{margin-top:10px;padding:10px;border-radius:10px;border:2px dashed var(--bd)}
.go{background:var(--ac);color:#fff;border-color:var(--ac);margin-top:8px}
:root[data-hc="1"] .go{color:#000}
.simbox{background:color-mix(in srgb,var(--ac) 8%,var(--sf));border:2px solid var(--bd);border-radius:12px;padding:8px;margin:8px 0}.simbox svg{max-height:230px}.simbox .ro{font-weight:700;margin-top:4px}.num{font:inherit;padding:8px;border-radius:10px;border:2px solid var(--bd);width:110px;background:var(--sf);color:var(--tx)}
.conf{position:fixed;top:-30px;font-size:26px;pointer-events:none;z-index:99;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
.robot{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:2.2em;background:var(--sf);border:2px solid var(--bd);border-radius:50%;width:64px;height:64px;display:grid;place-items:center;z-index:25;cursor:pointer;animation:bob 3s infinite}
#bub{position:fixed;right:84px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--sf);border:2px solid var(--ac);border-radius:14px;padding:8px 12px;max-width:300px;white-space:pre-line;font-size:.92em;cursor:pointer;z-index:25;display:none}
@media (max-width:760px){aside{position:fixed;inset:0 25% 0 0;z-index:40;transform:translateX(-105%);transition:transform .3s;width:auto;padding-top:60px}aside.open{transform:none}#menu{display:inline-block}}
@media print{header,aside,.robot,#bub,.tabs,.go,.conf{display:none!important}body{background:#fff;color:#000}.card{break-inside:avoid;animation:none}.wrap{display:block}}

/* ===== v3: красочный детский стиль ===== */
:root:not([data-hc="1"]) body{font-family:"Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif;background-color:var(--bg);background-image:radial-gradient(circle at 20px 20px,color-mix(in srgb,var(--S) 28%,transparent) 3px,transparent 4px),radial-gradient(circle at 60px 50px,color-mix(in srgb,var(--B) 24%,transparent) 3px,transparent 4px),linear-gradient(135deg,color-mix(in srgb,var(--A) 14%,var(--bg)),color-mix(in srgb,var(--B) 16%,var(--bg)) 50%,color-mix(in srgb,var(--C) 14%,var(--bg)));background-size:80px 80px,80px 80px,auto;background-attachment:fixed}
:root:not([data-hc="1"]) header{background:linear-gradient(90deg,color-mix(in srgb,var(--A) 30%,var(--sf)),color-mix(in srgb,var(--B) 30%,var(--sf)),color-mix(in srgb,var(--C) 30%,var(--sf)));border-bottom:4px solid var(--S);border-radius:0 0 22px 22px}
:root:not([data-hc="1"]) h1{font-size:1.3em;font-weight:900}
:root:not([data-hc="1"]) button{border-radius:16px;border-width:3px;font-weight:700}
:root:not([data-hc="1"]) aside{background:color-mix(in srgb,var(--sf) 88%,var(--B));border-right:4px dotted var(--B)}
:root:not([data-hc="1"]) .tp{border-left:8px solid var(--B);border-radius:16px}
:root:not([data-hc="1"]) .tp:nth-of-type(4n+1){border-left-color:var(--A)}
:root:not([data-hc="1"]) .tp:nth-of-type(4n+2){border-left-color:var(--B)}
:root:not([data-hc="1"]) .tp:nth-of-type(4n+3){border-left-color:var(--C)}
:root:not([data-hc="1"]) .tp:nth-of-type(4n){border-left-color:var(--S)}
:root:not([data-hc="1"]) .goal{background:color-mix(in srgb,var(--B) 14%,var(--sf));border:3px solid var(--B);border-left-width:10px;border-radius:20px;box-shadow:0 4px 0 color-mix(in srgb,var(--B) 40%,transparent)}
:root:not([data-hc="1"]) .goal[style]{background:color-mix(in srgb,#ffd84d 30%,var(--sf));border-color:var(--S);border-style:dashed;transform:rotate(-.6deg)}
:root:not([data-hc="1"]) .card{border-radius:26px;border-width:4px;box-shadow:0 6px 0 color-mix(in srgb,var(--bd) 90%,transparent)}
.card[data-lv="A"]{border-color:var(--A)!important;background:color-mix(in srgb,var(--A) 7%,var(--sf))!important}
.card[data-lv="B"]{border-color:var(--B)!important;background:color-mix(in srgb,var(--B) 7%,var(--sf))!important}
.card[data-lv="C"]{border-color:var(--C)!important;background:color-mix(in srgb,var(--C) 7%,var(--sf))!important}
.card[data-lv="S"]{border-color:var(--S)!important;background:color-mix(in srgb,var(--S) 9%,var(--sf))!important}
.badge{font-size:1em;padding:4px 16px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.card[data-lv="A"] .badge::before{content:"🌱 "}.card[data-lv="B"] .badge::before{content:"🚀 "}.card[data-lv="C"] .badge::before{content:"🏆 "}.card[data-lv="S"] .badge::before{content:"⭐ "}
.em{font-size:3em;filter:drop-shadow(0 4px 3px rgba(0,0,0,.18))}
:root:not([data-hc="1"]) .opt{border-radius:18px;border-width:3px;padding:12px 14px;font-weight:700}

:root:not([data-hc="1"]) .go{border-radius:999px;padding:10px 22px;font-size:1.05em;font-weight:900;background:linear-gradient(90deg,var(--B),var(--C));box-shadow:0 5px 0 rgba(0,0,0,.22)}
:root:not([data-hc="1"]) .go:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.tabs button{border-radius:999px!important;padding:8px 18px}
.bar{height:20px;border-radius:999px;border:3px solid var(--bd)}
.bar i{border-radius:999px;background:linear-gradient(90deg,var(--A),var(--S),var(--C))}
.chip{box-shadow:0 3px 0 rgba(0,0,0,.15)}
.num,select{border-radius:14px;border-width:3px}
.simbox{border-radius:20px;border:3px dashed var(--B)}
.ex{border-radius:16px;border-color:var(--S);background:color-mix(in srgb,var(--S) 12%,var(--sf))}
.robot{width:74px;height:74px;font-size:2.6em;border:4px solid var(--S);background:radial-gradient(circle,#fff6c9,var(--sf));box-shadow:0 0 0 5px color-mix(in srgb,var(--B) 35%,transparent),0 6px 14px rgba(0,0,0,.25)}
#bub{border-width:4px;border-color:var(--S);border-radius:22px;box-shadow:0 6px 16px rgba(0,0,0,.25);line-height:1.5}
@media print{body{background:#fff!important}.card,.goal{box-shadow:none!important;transform:none!important}}

.ds{margin:14px 0 4px;border:3px solid var(--B);border-radius:14px;padding:6px 10px;background:color-mix(in srgb,var(--B) 6%,var(--sf));overflow-x:auto}
.ds table{width:100%;border-collapse:collapse;font-size:.92em;margin:6px 0}
.ds th,.ds td{border:1px solid var(--bd);padding:5px 8px;text-align:left;vertical-align:top}
.ds th:last-child,.ds td:last-child{width:58px;text-align:center}
.ds th{background:color-mix(in srgb,var(--B) 16%,var(--sf))}
@media print{.ds{break-inside:avoid}.ds:not([open])>table{display:table}}

.student-info{display:flex;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--sf);border-bottom:2px solid var(--bd)}
.student-info label{display:flex;flex-direction:column;gap:4px;flex:1;min-width:160px;font-weight:700;font-size:.9em}
.student-info input{font:inherit;padding:8px 10px;border:2px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);min-width:0}
.score-total{margin:0 0 12px;padding:8px 12px;border:2px solid var(--bd);border-radius:12px;font-weight:900;text-align:right;background:var(--sf)}
.lock-overlay{display:none;position:fixed;inset:0;z-index:1000;background:rgba(10,16,28,.82);align-items:center;justify-content:center;padding:20px}
.lock-overlay.show{display:flex}
.lock-card{width:min(420px,100%);background:var(--sf);color:var(--tx);border:3px solid var(--ac);border-radius:20px;padding:22px;box-shadow:0 16px 50px #0006;text-align:center}
.lock-card h2{margin-top:0}.lock-card input{width:100%;font:inherit;padding:12px;border:2px solid var(--bd);border-radius:10px;margin:8px 0;background:var(--bg);color:var(--tx);text-align:center;letter-spacing:.2em}.lock-card button{background:var(--ac);color:white;border-color:var(--ac);width:100%;padding:10px}.lock-card #lockError{color:var(--no);min-height:1.5em}
@media(max-width:600px){.student-info label{min-width:100%}}
</style>

[0,"A","7.2.3.2","🛫",["Қай жағдайда дене бір мезгілде кинетикалық та, потенциалдық та энергияға ие?",["Үстелде жатқан кітап","Көтеріліп бара жатқан ұшақ","Тыныштықтағы тау басындағы тас","Жерде жатқан доп"],1,"Ұшақ қозғалады (кинетикалық) және жерден биікте (потенциалдық)."],["В каком случае тело одновременно обладает и кинетической, и потенциальной энергией?",["Книга на столе","Набирающий высоту самолёт","Камень, покоящийся на вершине горы","Мяч на земле"],1,"Самолёт движется (кинетическая) и находится высоко (потенциальная)."],["When does a body have both kinetic and potential energy?",["A book on a table","A plane climbing","A stone resting on a mountaintop","A ball on the ground"],1,"The plane moves (kinetic) and is high up (potential)."]],
[0,"B","7.2.3.3","🚗",["Массасы 1200 кг көлік 72 км/сағ жылдамдықпен келеді. Кинетикалық энергиясы қандай?",["24 кДж","240 кДж","480 кДж","86,4 МДж"],1,"1) Алдымен жылдамдықты аударамыз: 72 км/сағ = 20 м/с. 2) Формула: Eк = mv²/2. 3) Қоямыз: Eк = 1200·20²/2 = 240 000 Дж = 240 кДж."],["Автомобиль массой 1200 кг движется со скоростью 72 км/ч. Чему равна его кинетическая энергия?",["24 кДж","240 кДж","480 кДж","86,4 МДж"],1,"1) Переводим скорость: 72 км/ч = 20 м/с. 2) Формула: Eк = mv²/2. 3) Подставляем: Eк = 1200·20²/2 = 240 000 Дж = 240 кДж."],["A 1200 kg car moves at 72 km/h. What is its kinetic energy?",["24 kJ","240 kJ","480 kJ","86.4 MJ"],1,"1) Convert speed: 72 km/h = 20 m/s. 2) Formula: Ek = mv²/2. 3) Substitute: Ek = 1200·20²/2 = 240 000 J = 240 kJ."]],
[0,"C","7.2.3.4","🔩",["Серіппенің қатаңдығы 200 Н/м, ол 10 см-ге сығылды. Серпімді потенциалдық энергиясы қандай? (Eп = kx²/2)",["0,1 Дж","1 Дж","10 Дж","20 Дж"],1,"x = 0,1 м. Eп = 200·0,1²/2 = 1 Дж."],["Жёсткость пружины 200 Н/м, её сжали на 10 см. Чему равна потенциальная энергия упругой деформации? (Eп = kx²/2)",["0,1 Дж","1 Дж","10 Дж","20 Дж"],1,"x = 0,1 м. Eп = 200·0,1²/2 = 1 Дж."],["A spring with stiffness 200 N/m is compressed by 10 cm. What is its elastic potential energy? (Ep = kx²/2)",["0.1 J","1 J","10 J","20 J"],1,"x = 0.1 m. Ep = 200·0.1²/2 = 1 J."]],
[1,"A","7.2.3.5","🕰️",["Маятник ең төменгі нүктеден өткенде энергиясы қандай?",["Кинетикалық максимал, потенциалдық минимал","Екеуі де максимал","Потенциалдық максимал, кинетикалық нөл","Екеуі де нөл"],0,"Төменгі нүктеде биіктік ең аз, жылдамдық ең үлкен."],["Какова энергия маятника в нижней точке?",["Кинетическая максимальна, потенциальная минимальна","Обе максимальны","Потенциальная максимальна, кинетическая равна нулю","Обе равны нулю"],0,"В нижней точке высота минимальна, скорость максимальна."],["What is a pendulum’s energy at its lowest point?",["Kinetic maximum, potential minimum","Both maximum","Potential maximum, kinetic zero","Both zero"],0,"At the bottom the height is least and the speed greatest."]],
[1,"B","7.2.3.6","🪨",["Тас 20 м биіктіктен құлайды (үйкеліс жоқ, g = 10 м/с²). 5 м биіктікте жылдамдығы қандай?",["10 м/с","15 м/с","≈17 м/с","20 м/с"],2,"mg(20−5) = mv²/2, v² = 2·10·15 = 300, v ≈ 17 м/с. Масса керек емес."],["Камень падает с высоты 20 м (без трения, g = 10 м/с²). Какова скорость на высоте 5 м?",["10 м/с","15 м/с","≈17 м/с","20 м/с"],2,"mg(20−5) = mv²/2, v² = 2·10·15 = 300, v ≈ 17 м/с. Масса не нужна."],["A stone falls from 20 m (no friction, g = 10 m/s²). What is its speed at 5 m height?",["10 m/s","15 m/s","≈17 m/s","20 m/s"],2,"mg(20−5) = mv²/2, v² = 2·10·15 = 300, v ≈ 17 m/s. Mass is not needed."]],
[1,"C","7.2.3.6","🪨",["Дене 20 м/с жылдамдықпен тік жоғары лақтырылды (g = 10 м/с²). Қандай биіктікте кинетикалық энергиясы потенциалдыққа тең болады?",["5 м","10 м","15 м","20 м"],1,"1) Бастапқы толық энергия: E = mv²/2. 2) Екі энергия тең болса, әрқайсысы толық энергияның жартысына тең. 3) mgh = mv²/4, сондықтан h = v²/(4g) = 20²/(4·10) = 10 м."],["Тело брошено вверх со скоростью 20 м/с (g = 10 м/с²). На какой высоте кинетическая энергия равна потенциальной?",["5 м","10 м","15 м","20 м"],1,"1) Начальная полная энергия: E = mv²/2. 2) Если энергии равны, каждая равна половине полной энергии. 3) mgh = mv²/4, поэтому h = v²/(4g) = 20²/(4·10) = 10 м."],["A body is thrown up at 20 m/s (g = 10 m/s²). At what height is kinetic energy equal to potential energy?",["5 m","10 m","15 m","20 m"],1,"Total energy is mv²/2. If Ek = Ep: mgh = mv²/4, h = v²/(4g) = 400/40 = 10 m."]],
[2,"A","7.2.4.1","🧱",["Қозғалмалы блок арқылы жүкті көтергенде күштен қанша ұтамыз және неден ұтыламыз?",["Күштен 2 есе ұтамыз, жолдан 2 есе ұтыламыз","Күштен 2 есе, жұмыстан 2 есе ұтамыз","Ұтыс жоқ","Жолдан 2 есе ұтамыз"],0,"Алтын ереже: күштен ұтсақ, жолдан сонша есе ұтыламыз; жұмыстан ұтыс жоқ."],["Во сколько раз выигрыш в силе у подвижного блока и в чём проигрыш?",["В силе в 2 раза, проигрыш в пути в 2 раза","В силе и в работе в 2 раза","Выигрыша нет","В пути в 2 раза"],0,"Золотое правило: выигрыш в силе — проигрыш в пути; в работе выигрыша нет."],["What does a movable pulley give and cost?",["Force ×2 gained, distance ×2 lost","Force and work ×2 gained","No gain","Distance ×2 gained"],0,"Golden rule: gain in force costs distance; work is never gained."]],
[2,"B","7.2.4.1","🏋️",["Салмағы 400 Н жүкті қозғалмалы блокпен (идеал) 3 м-ге көтереді. Жіптің қанша метрін тарту керек?",["1,5 м","3 м","6 м","12 м"],2,"Күш 200 Н болады, ал жіп жолы 2 есе артады: 2·3 = 6 м."],["Груз весом 400 Н поднимают на 3 м подвижным блоком (идеальным). Сколько метров верёвки нужно вытянуть?",["1,5 м","3 м","6 м","12 м"],2,"Сила 200 Н, зато путь верёвки вдвое больше: 2·3 = 6 м."],["A 400 N load is raised 3 m with an ideal movable pulley. How much rope must be pulled?",["1.5 m","3 m","6 m","12 m"],2,"Force is 200 N, but the rope path doubles: 2·3 = 6 m."]],
[2,"C","7.2.4.2","🔧",["Кілтті 0,3 м иінмен 50 Н күшпен бұрады. Иінді 0,1 м-ге дейін қысқартсақ, сол күш моментін беру үшін қандай күш керек?",["50 Н","100 Н","150 Н","450 Н"],2,"M = 50·0,3 = 15 Н·м. F = M/d = 15/0,1 = 150 Н."],["Гаечный ключ с плечом 0,3 м поворачивают силой 50 Н. Какая сила нужна для того же момента при плече 0,1 м?",["50 Н","100 Н","150 Н","450 Н"],2,"M = 50·0,3 = 15 Н·м. F = M/d = 15/0,1 = 150 Н."],["A wrench with a 0.3 m arm is turned with 50 N. What force gives the same moment with a 0.1 m arm?",["50 N","100 N","150 N","450 N"],2,"M = 50·0.3 = 15 N·m. F = M/d = 15/0.1 = 150 N."]],
[3,"A","7.2.4.3","📌",["Жазық фигураны екі әртүрлі нүктеден ілгенде массалық центр қайда болады?",["Екі вертикаль түзудің қиылысында","Ілу нүктесінде","Фигураның ең төменгі нүктесінде","Кез келген жерде"],0,"Ілінген дене тепе-теңдікте массалық центр ілу нүктесінің дәл астында тұрады; екі түзудің қиылысы – центр."],["Где находится центр масс плоской фигуры, если её подвесить в двух разных точках?",["На пересечении двух вертикальных линий","В точке подвеса","В самой нижней точке","Где угодно"],0,"В равновесии центр масс лежит под точкой подвеса; пересечение двух линий — центр масс."],["Where is a flat figure’s centre of mass if you hang it from two different points?",["Where the two vertical lines cross","At the pivot","At the lowest point","Anywhere"],0,"At rest the centre lies below the pivot; two plumb lines cross at it."]],
[3,"B","7.2.4.3","🏋️",["Салмақсыз 1 м таяқтың бір ұшында 1 кг, екінші ұшында 3 кг жүк бар. Массалық центр ауыр жүктен қандай қашықтықта?",["0,25 м","0,5 м","0,33 м","0,75 м"],0,"3x = 1·(1−x), x = 0,25 м."],["На концах невесомой палки длиной 1 м грузы 1 кг и 3 кг. На каком расстоянии от тяжёлого груза центр масс?",["0,25 м","0,5 м","0,33 м","0,75 м"],0,"3x = 1·(1−x), x = 0,25 м."],["Masses 1 kg and 3 kg sit at the ends of a weightless 1 m rod. How far from the heavy mass is the centre of mass?",["0.25 m","0.5 m","0.33 m","0.75 m"],0,"3x = 1·(1−x), x = 0.25 m."]],
[3,"C","7.2.4.3","📏",["Ұзындығы 40 см біртекті сызғышты үстел шетінен шығарады. Құламай тұру үшін ең көп қанша см шығаруға болады?",["10 см","20 см","30 см","40 см"],1,"Массалық центр сызғыштың ортасында (20 см). Ол үстел үстінде болуы керек, сондықтан ең көбі 20 см."],["Однородную линейку длиной 40 см выдвигают за край стола. На сколько см её можно выдвинуть, чтобы не упала?",["10 см","20 см","30 см","40 см"],1,"Центр масс в середине (20 см) и должен быть над столом, поэтому максимум 20 см."],["A uniform 40 cm ruler is pushed over a table edge. What is the greatest overhang before it falls?",["10 cm","20 cm","30 cm","40 cm"],1,"The centre of mass is at 20 cm and must stay over the table, so 20 cm at most."]],
[4,"A","7.2.4.5","🧪",["Тәжірибеде иіндіктің сол жағында F₁ = 2 Н, d₁ = 15 см, оң жақ иін d₂ = 10 см. Тепе-теңдік үшін F₂ қандай?",["1,3 Н","3 Н","5 Н","30 Н"],1,"F₁d₁ = F₂d₂, F₂ = 2·15/10 = 3 Н."],["В опыте слева F₁ = 2 Н, d₁ = 15 см, правое плечо d₂ = 10 см. Какова F₂ для равновесия?",["1,3 Н","3 Н","5 Н","30 Н"],1,"F₁d₁ = F₂d₂, F₂ = 2·15/10 = 3 Н."],["In an experiment F₁ = 2 N, d₁ = 15 cm, right arm d₂ = 10 cm. What F₂ gives balance?",["1.3 N","3 N","5 N","30 N"],1,"F₁d₁ = F₂d₂, F₂ = 2·15/10 = 3 N."]],
[4,"B","7.2.4.4","📐",["Ұзындығы 80 см салмақсыз иіндікке 12 Н және 4 Н күштер әсер етеді. Тірек үлкен күштен қандай қашықтықта тұруы керек?",["20 см","26,7 см","40 см","60 см"],0,"12d = 4(80−d), 16d = 320, d = 20 см."],["На невесомый рычаг длиной 80 см действуют силы 12 Н и 4 Н. На каком расстоянии от большей силы должна быть опора?",["20 см","26,7 см","40 см","60 см"],0,"12d = 4(80−d), 16d = 320, d = 20 см."],["Forces 12 N and 4 N act on the ends of a weightless 80 cm lever. How far from the larger force must the pivot be?",["20 cm","26.7 cm","40 cm","60 cm"],0,"12d = 4(80−d), 16d = 320, d = 20 cm."]],
[4,"C","7.2.4.4","🪵",["Салмағы 40 Н, ұзындығы 2 м біртекті арқалық сол шетінен 0,4 м қашықтықта тіреуде тұр. Сол шетіне қандай жүк іліп, тепе-теңдікке келтіруге болады?",["24 Н","40 Н","60 Н","100 Н"],2,"Арқалық салмағы ортасында (1 м), тіректен 0,6 м. 40·0,6 = F·0,4, F = 60 Н."],["Однородная балка весом 40 Н и длиной 2 м опирается на опору в 0,4 м от левого конца. Какой груз на левом конце уравновесит её?",["24 Н","40 Н","60 Н","100 Н"],2,"Вес балки приложен в середине (1 м), в 0,6 м от опоры. 40·0,6 = F·0,4, F = 60 Н."],["A uniform 40 N, 2 m beam rests on a pivot 0.4 m from its left end. What load on the left end balances it?",["24 N","40 N","60 N","100 N"],2,"The beam’s weight acts at its middle, 0.6 m from the pivot. 40·0.6 = F·0.4, F = 60 N."]],
[5,"A","7.2.4.6","📉",["Нақты механизмнің ПӘК-і неге 100%-дан кіші болады?",["Үйкеліс және механизм бөліктерін қозғау үшін энергияның бір бөлігі жұмсалады","Өлшеу құралдары қате","Пайдалы жұмыс нөлге тең","Механизм жұмыс істемейді"],0,"η = Aпайд/Aтолық·100%. Aтолық әрқашан Aпайд-тан үлкен."],["Почему КПД реального механизма меньше 100 %?",["Часть энергии тратится на трение и движение частей механизма","Приборы неточны","Полезная работа равна нулю","Механизм не работает"],0,"η = Aпол/Aполн·100 %. У реального механизма полная работа больше полезной."],["Why is the efficiency of a real machine below 100%?",["Some energy goes into friction and moving the parts","Instruments are inaccurate","Useful work is zero","The machine does not work"],0,"η = Auseful/Atotal·100%. Atotal is always larger."]],
[5,"B","7.2.4.6","📦",["Салмағы 200 Н жүкті 1 м биіктікке көлбеу жазықтықпен көтеру үшін ұзындығы 3 м жол бойымен 100 Н күш салынды. ПӘК қандай?",["33 %","50 %","66,7 %","150 %"],2,"Aпайд = 200·1 = 200 Дж, Aтолық = 100·3 = 300 Дж, η = 200/300 ≈ 66,7 %."],["Груз 200 Н поднимают на 1 м по наклонной плоскости длиной 3 м с силой 100 Н. Каков КПД?",["33 %","50 %","66,7 %","150 %"],2,"Aпол = 200·1 = 200 Дж, Aполн = 100·3 = 300 Дж, η = 200/300 ≈ 66,7 %."],["A 200 N load is raised 1 m up a 3 m ramp with a 100 N pull. What is the efficiency?",["33%","50%","66.7%","150%"],2,"Auseful = 200·1 = 200 J, Atotal = 100·3 = 300 J, η = 200/300 ≈ 66.7%."]],
[5,"C","7.2.4.6","🛷",["Массасы 50 кг жүкті 1,5 м биіктікке 5 м көлбеу жазықтықпен 200 Н күшпен көтереді (g = 10 м/с²). Үйкеліс күші қандай?",["40 Н","50 Н","100 Н","200 Н"],1,"Aпайд = 50·10·1,5 = 750 Дж, Aтолық = 200·5 = 1000 Дж (η = 75 %). Шығын 250 Дж = Fүйк·5, Fүйк = 50 Н."],["Груз 50 кг поднимают на 1,5 м по плоскости длиной 5 м с силой 200 Н (g = 10 м/с²). Чему равна сила трения?",["40 Н","50 Н","100 Н","200 Н"],1,"Aпол = 50·10·1,5 = 750 Дж, Aполн = 200·5 = 1000 Дж (η = 75 %). Потери 250 Дж = Fтр·5, Fтр = 50 Н."],["A 50 kg load is raised 1.5 m up a 5 m ramp with a 200 N pull (g = 10 m/s²). What is the friction force?",["40 N","50 N","100 N","200 N"],1,"Auseful = 50·10·1.5 = 750 J, Atotal = 200·5 = 1000 J (η = 75%). Loss 250 J = Ffr·5, Ffr = 50 N."]],

[2,"B","7.2.3.6","🪨",["Қатаңдығы 400 Н/м серіппе 5 см-ге сығылып, массасы 20 г шағын арбашаны итереді. Арбашаның жылдамдығы қандай?",["≈5 м/с","≈7,1 м/с","≈10 м/с","≈50 м/с"],1,"kx²/2 = 0,5 Дж = mv²/2, v² = 2·0,5/0,02 = 50, v ≈ 7,1 м/с."],["Пружина жёсткостью 400 Н/м сжата на 5 см и толкает тележку массой 20 г. Какова скорость тележки?",["≈5 м/с","≈7,1 м/с","≈10 м/с","≈50 м/с"],1,"kx²/2 = 0,5 Дж = mv²/2, v² = 2·0,5/0,02 = 50, v ≈ 7,1 м/с."],["A 400 N/m spring compressed 5 cm pushes a 20 g cart. What is the cart’s speed?",["≈5 m/s","≈7.1 m/s","≈10 m/s","≈50 m/s"],1,"kx²/2 = 0.5 J = mv²/2, v² = 2·0.5/0.02 = 50, v ≈ 7.1 m/s."]],
[2,"C","7.2.3.6","🎢",["🎢 Модельде арбашаны жіберіп көр. Үйкеліссіз горкадан төменде жылдамдық 12 м/с болу үшін горканың биіктігі қандай болуы керек?",null,7.2,"mgh = mv²/2, h = v²/(2g) = 144/20 = 7,2 м. Массаға тәуелді емес.",0.1,"м"],["🎢 Запусти тележку в модели. Какой должна быть высота горки без трения, чтобы внизу скорость была 12 м/с?",null,7.2,"mgh = mv²/2, h = v²/(2g) = 144/20 = 7,2 м. От массы не зависит.",0.1,"м"],["🎢 Try the cart in the model. What hill height (no friction) gives 12 m/s at the bottom?",null,7.2,"mgh = mv²/2, h = v²/(2g) = 144/20 = 7.2 m. Mass does not matter.",0.1,"m"],["drop",{m:2}]],

E(2,"S2","7.2.3.5","🏀",["🏀 Қағылған доп әр жолы төмен көтеріледі. Энергия қайда кетті?","Қоршаған ортаға берілді","Жоғалып кетті","Энергия жоғалмайды: соқтығысқанда оның бір бөлігі қоршаған ортаға беріледі. Сондықтан доп келесіде төменірек көтеріледі."],["🏀 Мяч с каждым отскоком прыгает ниже. Куда ушла энергия?","Передалась окружающей среде","Исчезла","Энергия не исчезает: при ударе часть передаётся окружающей среде. Поэтому следующий прыжок ниже."],["🏀 A bouncing ball rises less each time. Where did the energy go?","Was transferred to the surroundings","Vanished","Energy does not disappear: some is transferred to the surroundings when the ball hits the floor. That is why the next bounce is lower."],0),

[5,"B","7.2.4.5","📋",["Тәжірибе: 1-жағы F₁ = 1,5 Н, d₁ = 20 см; 2-жағы F₂ = 2,6 Н, d₂ = 12 см. Қателігі ≤ 5 % болса, тепе-теңдік шарты орындала ма?",["Иә: 30 Н·см ≈ 31,2 Н·см (қателік ≈ 4 %)","Жоқ: 30 ≠ 31,2","Иә: 1,5 + 20 = 2,6 + 12","Жоқ: иіндер әртүрлі"],0,"M₁ = 1,5·20 = 30 Н·см, M₂ = 2,6·12 = 31,2 Н·см. Айырмасы 1,2/30 = 4 % < 5 %."],["Опыт: слева F₁ = 1,5 Н, d₁ = 20 см; справа F₂ = 2,6 Н, d₂ = 12 см. Выполняется ли условие равновесия при погрешности ≤ 5 %?",["Да: 30 Н·см ≈ 31,2 Н·см (погрешность ≈ 4 %)","Нет: 30 ≠ 31,2","Да: 1,5 + 20 = 2,6 + 12","Нет: плечи разные"],0,"M₁ = 1,5·20 = 30 Н·см, M₂ = 2,6·12 = 31,2 Н·см. Разница 1,2/30 = 4 % < 5 %."],["Experiment: left F₁ = 1.5 N, d₁ = 20 cm; right F₂ = 2.6 N, d₂ = 12 cm. Is balance satisfied within 5% error?",["Yes: 30 N·cm ≈ 31.2 N·cm (≈ 4% error)","No: 30 ≠ 31.2","Yes: 1.5 + 20 = 2.6 + 12","No: the arms differ"],0,"M₁ = 1.5·20 = 30 N·cm, M₂ = 2.6·12 = 31.2 N·cm. Difference 1.2/30 = 4% < 5%."]],
[5,"C","7.2.4.5","🧪",["⚖️ Модельде иіндікті тепе-теңдікке келтір: сол жақта 6 кг жүк тіректен 0,3 м қашықтықта. Оң жақтағы 2 кг жүкті тіректен қандай қашықтыққа қою керек?",null,0.9,"m₁d₁ = m₂d₂, d₂ = 6·0,3/2 = 0,9 м.",0.02,"м"],["⚖️ Уравновесь рычаг в модели: слева груз 6 кг на расстоянии 0,3 м от опоры. На каком расстоянии от опоры нужно подвесить справа груз 2 кг?",null,0.9,"m₁d₁ = m₂d₂, d₂ = 6·0,3/2 = 0,9 м.",0.02,"м"],["⚖️ Balance the lever in the model: a 6 kg load is 0.3 m left of the pivot. How far right of the pivot must the 2 kg load hang?",null,0.9,"m₁d₁ = m₂d₂, d₂ = 6·0.3/2 = 0.9 m.",0.02,"m"],["lever",{m1:6,d1:0.3,m2:2}]],

E(5,"S3","7.2.4.5","📏",["📏 Тепе-теңдікте иіндік қалай тұрады?","Көлденең","Көлбеу","Тепе-теңдікте иіндік көлденең тұрады."],["📏 Как стоит рычаг в равновесии?","Горизонтально","Наклонно","В равновесии рычаг горизонтален."],["📏 How does a balanced lever sit?","Horizontal","Tilted","A balanced lever is horizontal."],1),
[6,"A","7.2.4.4","🪜",["Иіндіктің сол жағында тіректен 30 см-де 2 Н және 10 см-де 4 Н жүк ілулі. Оң жақта 5 Н күш қандай қашықтыққа ілінсе тепе-теңдік болады?",["10 см","20 см","25 см","40 см"],1,"Сол жақ моменттер: 2·30 + 4·10 = 100 Н·см. 5·d = 100, d = 20 см."],["Слева на рычаге: 2 Н на расстоянии 30 см и 4 Н на 10 см от опоры. На каком расстоянии справа нужно подвесить 5 Н для равновесия?",["10 см","20 см","25 см","40 см"],1,"Моменты слева: 2·30 + 4·10 = 100 Н·см. 5·d = 100, d = 20 см."],["On the left: 2 N at 30 cm and 4 N at 10 cm from the pivot. How far right must 5 N hang to balance?",["10 cm","20 cm","25 cm","40 cm"],1,"Left moments: 2·30 + 4·10 = 100 N·cm. 5·d = 100, d = 20 cm."]],
E(6,"S3","7.2.4.4","🧸",["🧸 Күш үлкен болса, оның иіні тепе-теңдікте … болады.","қысқа","ұзын","F₁d₁ = F₂d₂: күш үлкен – иін қысқа."],["🧸 Чем больше сила, тем её плечо в равновесии …","короче","длиннее","F₁d₁ = F₂d₂: больше сила — короче плечо."],["🧸 The larger the force, the … its arm in balance.","shorter","longer","F₁d₁ = F₂d₂: bigger force, shorter arm."],1),
[8,"A","7.2.4.6","📐",["Пайдалы жұмыс 100 Дж, толық жұмыс 200 Дж болса, көлбеу жазықтықтың ПӘК-і қандай?",["50 %","25 %","100 %","200 %"],0,"1) ПӘК = пайдалы жұмыс / толық жұмыс · 100%. 2) η = 100/200·100% = 50%."],["Полезная работа равна 100 Дж, полная — 200 Дж. Чему равен КПД наклонной плоскости?",["50 %","25 %","100 %","200 %"],0,"1) КПД = полезная работа / полная работа · 100%. 2) η = 100/200·100% = 50%."],["Useful work is 100 J and total work is 200 J. What is the efficiency?",["50%","25%","100%","200%"],0,"1) Efficiency = useful work / total work · 100%. 2) η = 100/200·100% = 50%."]],
[8,"B","7.2.4.6","🧮",["ПӘК 80 %, пайдалы жұмыс 960 Дж. Толық жұмыс және жоғалған энергия қандай?",["1200 Дж және 240 Дж","768 Дж және 192 Дж","1200 Дж және 960 Дж","960 Дж және 240 Дж"],0,"Aтолық = 960/0,8 = 1200 Дж; шығын 1200 − 960 = 240 Дж."],["КПД 80 %, полезная работа 960 Дж. Найдите полную работу и потерянную энергию.",["1200 Дж и 240 Дж","768 Дж и 192 Дж","1200 Дж и 960 Дж","960 Дж и 240 Дж"],0,"1) КПД = полезная работа / полная работа. 2) 80% = 0,8, поэтому Aполн = 960/0,8 = 1200 Дж. 3) Разница: 1200 − 960 = 240 Дж."],["Efficiency 80%, useful work 960 J. Find total work and wasted energy.",["1200 J and 240 J","768 J and 192 J","1200 J and 960 J","960 J and 240 J"],0,"Atotal = 960/0.8 = 1200 J; waste 1200 − 960 = 240 J."]],
[8,"C","7.2.4.6","📉",["📉 Салмағы 100 Н жүкті 0,5 м биіктікке көтеру үшін 40 Н күшпен 2 м жол жүрілді. ПӘК-ті есепте.",["50 %","62,5 %","80 %","100 %"],1,"1) Пайдалы жұмыс: Aпайд = P·h = 100·0,5 = 50 Дж. 2) Толық жұмыс: Aтол = F·L = 40·2 = 80 Дж. 3) η = 50/80·100% = 62,5%."],["📉 Груз весом 100 Н подняли на высоту 0,5 м силой 40 Н, пройдя 2 м. Найдите КПД.",["50 %","62,5 %","80 %","100 %"],1,"1) Полезная работа: Aпол = P·h = 100·0,5 = 50 Дж. 2) Полная работа: Aполн = F·L = 40·2 = 80 Дж. 3) КПД = 50/80·100% = 62,5%."],["📉 A 100 N load is raised 0.5 m using a 40 N force over 2 m. Find the efficiency.",["50%","62.5%","80%","100%"],1,"1) Useful work: Wu = P·h = 100·0.5 = 50 J. 2) Total work: Wt = F·L = 40·2 = 80 J. 3) Efficiency = 50/80·100% = 62.5%."],null],
E(8,"S1","7.2.4.6","📏",["📏 ПӘК формуласының алымында қандай жұмыс тұр?","Пайдалы","Толық","η = Aпайдалы / Aтолық."],["📏 Какая работа в числителе формулы КПД?","Полезная","Полная","η = Aполезная / Aполная."],["📏 Which work is in the numerator of efficiency?","Useful","Total","η = Auseful / Atotal."],0),
E(8,"S2","7.2.4.6","🪵",["🪵 Көлбеу жазықтықта үйкеліс көп болса, ПӘК …","кіші","үлкен","Үйкеліс көп болса, жүкті жылжытуға көбірек күш жұмсалады, сондықтан пайдалы жұмыстың үлесі азаяды."],["🪵 Чем больше трение на плоскости, тем КПД …","меньше","больше","При большем трении требуется больше работы, поэтому доля полезной работы уменьшается."],["🪵 The more friction on a ramp, the … the efficiency.","lower","higher","More work is spent overcoming friction, so the useful share is smaller."],1),
E(8,"S3","7.2.4.6","🧮",["🧮 ПӘК = 50 % болса, жұмыстың жартысы пайдалы ма?","Иә","Жоқ","50 % – толық жұмыстың жартысы пайдалы."],["🧮 Если КПД = 50 %, половина работы полезна?","Да","Нет","50 % — половина полной работы полезна."],["🧮 If efficiency is 50%, is half of the work useful?","Yes","No","50% means half of the total work is useful."],0),
[11,"C","7.7.1.3","🌍",["🌍 Солтүстік жарты шарда ең ұзақ күн шамамен қашан болады және неге?",["Маусымның 20–22-сі: Жер осі көлбеу болғандықтан, солтүстік жарты шар Күнге қарай бағытталады","Желтоқсанның 20–22-сі: Жер Күнге жақындайды","Наурызда: Ай жарығы ұзарады","Қыркүйекте: Жер тоқтайды"],0,"Жер осі көлбеу орналасқан. Маусым айында солтүстік жарты шар Күнге қарай еңкейеді. Сондықтан Күн көкжиектен ұзақ көрінеді: күн ұзарады, түн қысқарады."],["🌍 Когда в Северном полушарии бывает самый длинный день и почему?",["Около 20–22 июня: из-за наклона земной оси Северное полушарие обращено к Солнцу","Около 20–22 декабря: Земля ближе к Солнцу","В марте: Луна светит дольше","В сентябре: Земля останавливается"],0,"Земная ось наклонена. В июне Северное полушарие наклонено к Солнцу, поэтому Солнце дольше находится над горизонтом: день длиннее, ночь короче."],["🌍 When is the longest day in the Northern Hemisphere, and why?",["Around June 20–22: Earth's tilted axis turns the Northern Hemisphere toward the Sun","Around December 20–22: Earth is closer to the Sun","In March: the Moon shines longer","In September: Earth stops"],0,"Earth's axis is tilted. In June the Northern Hemisphere is tilted toward the Sun, so the Sun stays above the horizon longer: the day is longer and the night shorter."],null],
[12,"A","7.2.4.6","🧲",["Тәжірибеде динамометр F = 2,5 Н, көлбеу жолдың ұзындығы 0,8 м, 4 Н жүк 0,3 м биіктікке көтерілді. ПӘК қандай?",["48 %","60 %","75 %","83 %"],1,"Aпайд = 4·0,3 = 1,2 Дж, Aтолық = 2,5·0,8 = 2,0 Дж, η = 60 %."],["В опыте динамометр показал F = 2,5 Н, путь по наклонной 0,8 м, груз 4 Н поднят на 0,3 м. Каков КПД?",["48 %","60 %","75 %","83 %"],1,"Aпол = 4·0,3 = 1,2 Дж, Aполн = 2,5·0,8 = 2,0 Дж, η = 60 %."],["The spring balance reads F = 2.5 N, the incline path is 0.8 m, a 4 N load rose 0.3 m. Efficiency?",["48%","60%","75%","83%"],1,"Auseful = 4·0.3 = 1.2 J, Atotal = 2.5·0.8 = 2.0 J, η = 60%."]],
[12,"B","7.2.4.6","🚚",["100 кг жүкті 2 м биіктікке көлбеу жазықтықпен 500 Н күшпен тартады, ПӘК 80 % (g = 10 м/с²). Жазықтық ұзындығы қанша?",["4 м","5 м","6,25 м","10 м"],1,"Aпайд = 100·10·2 = 2000 Дж; Aтолық = 2000/0,8 = 2500 Дж = 500·L, L = 5 м."],["Груз 100 кг поднимают на 2 м по наклонной плоскости силой 500 Н, КПД 80 % (g = 10 м/с²). Какова длина плоскости?",["4 м","5 м","6,25 м","10 м"],1,"Aпол = 100·10·2 = 2000 Дж; Aполн = 2000/0,8 = 2500 Дж = 500·L, L = 5 м."],["A 100 kg load is pulled up 2 m by a 500 N force on an incline with 80% efficiency (g = 10 m/s²). How long is the incline?",["4 m","5 m","6.25 m","10 m"],1,"Auseful = 100·10·2 = 2000 J; Atotal = 2000/0.8 = 2500 J = 500·L, L = 5 m."]],
